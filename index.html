<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>사진 압축</title>
<style>
  :root {
    --ink: #1a1d1a;
    --paper: #eef0ec;
    --line: #c7cbc2;
    --accent: #3d5a45;
    --accent-dim: #7c9484;
    --danger: #9a4a3a;
    --mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  header .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent-dim);
    letter-spacing: 0.02em;
  }
  .sub {
    font-size: 12.5px;
    color: #5a5f57;
    margin: 8px 0 22px;
    line-height: 1.5;
  }

  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 2px;
    padding: 30px 16px;
    text-align: center;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.active { border-color: var(--accent); background: #f3f6f2; }
  .drop-icon {
    width: 34px; height: 34px;
    margin: 0 auto 10px;
    color: var(--accent-dim);
  }
  .drop-main { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
  .drop-sub { font-size: 12px; color: #8a8f86; font-family: var(--mono); }
  input[type=file] { display: none; }

  .panel {
    margin-top: 18px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .row:last-child { border-bottom: none; }
  .row-label { font-size: 13px; font-weight: 600; }
  .row-hint { font-size: 11px; color: #8a8f86; font-family: var(--mono); margin-top: 2px; }

  .seg {
    display: flex;
    border: 1px solid var(--ink);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .seg button {
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 12px;
    border: none;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    border-right: 1px solid var(--ink);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--ink); color: #fff; }

  .qual-row { flex-direction: column; align-items: stretch; }
  .qual-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .qual-val { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
    margin: 4px 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink);
    cursor: pointer;
    border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--ink);
  }
  .ticks {
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 9.5px; color: #a3a89e;
    padding: 0 1px; margin-top: 2px;
  }

  .filelist { margin-top: 16px; }
  .file-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .file-item:last-child { border-bottom: none; }
  .thumb {
    width: 38px; height: 38px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .finfo { flex: 1; min-width: 0; }
  .fname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fsize { font-family: var(--mono); font-size: 11px; color: #8a8f86; margin-top: 1px; }
  .fsize .arrow { color: var(--accent); font-weight: 700; }
  .fstatus { font-family: var(--mono); font-size: 10.5px; flex-shrink: 0; color: var(--accent-dim); }
  .fstatus.done { color: var(--accent); }

  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button.primary, button.secondary {
    flex: 1;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 14px;
    border-radius: 2px;
    border: none;
    cursor: pointer;
  }
  button.primary { background: var(--ink); color: #fff; }
  button.primary:disabled { background: #b9bdb4; cursor: not-allowed; }
  button.secondary { background: #fff; border: 1px solid var(--ink); color: var(--ink); flex: 0 0 auto; padding: 14px 18px; }

  .total {
    margin-top: 14px;
    padding: 12px 14px;
    background: #f3f6f2;
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
  .total b { color: var(--accent); }

  footer {
    margin-top: 28px;
    font-size: 11px;
    color: #9a9e96;
    font-family: var(--mono);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>사진 압축</h1>
    <span class="tag">LOCAL / NO PHOTO UPLOAD</span>
  </header>
  <p class="sub">사진은 서버로 업로드되지 않습니다. 브라우저 안에서 처리됩니다. JPEG, PNG 및 ZIP을 지원합니다.</p>

  <div class="drop" id="drop">
    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3v13m0-13l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="drop-main">사진 선택</div>
    <div class="drop-sub">탭하여 여러 장 선택 · JPG / PNG / ZIP</div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,.zip,application/zip" multiple>
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <div class="row-label">출력 형식</div>
        <div class="row-hint">PNG는 손실 압축 시 JPG로 변환됩니다</div>
      </div>
      <div class="seg" id="formatSeg">
        <button data-v="auto" class="on">원본유지</button>
        <button data-v="jpeg">JPG로</button>
      </div>
    </div>

    <div class="row qual-row">
      <div class="qual-top">
        <div>
          <div class="row-label">압축 품질</div>
          <div class="row-hint" id="qualHint">10 단위 조절 · 낮을수록 용량↓ 화질↓</div>
        </div>
        <div class="qual-val" id="qualVal">80</div>
      </div>
      <input type="range" id="qualSlider" min="10" max="100" step="10" value="80">
      <div class="ticks"><span>10</span><span>30</span><span>50</span><span>70</span><span>90</span></div>
    </div>
  </div>

  <div id="zipStatus" style="display:none; font-family: var(--mono); font-size: 12px; color: #8a8f86; margin-top: 12px; white-space: pre-line; line-height: 1.6;">ZIP 압축 해제 중...</div>
  <div class="filelist" id="filelist"></div>

  <div class="total" id="total" style="display:none;">
    <span>합계</span>
    <span><span id="totalBefore"></span> → <b id="totalAfter"></b></span>
  </div>

  <div class="actions" id="actions" style="display:none;">
    <button class="primary" id="runBtn">전체 압축 실행</button>
    <button class="secondary" id="dlBtn" disabled>ZIP 저장</button>
  </div>

  <footer>
    ImageMagick 없이 브라우저 Canvas API로 직접 처리<br>
    사진은 기기를 벗어나지 않습니다
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const filelist = document.getElementById('filelist');
const actions = document.getElementById('actions');
const runBtn = document.getElementById('runBtn');
const dlBtn = document.getElementById('dlBtn');
const totalEl = document.getElementById('total');
const totalBefore = document.getElementById('totalBefore');
const totalAfter = document.getElementById('totalAfter');
const qualSlider = document.getElementById('qualSlider');
const qualVal = document.getElementById('qualVal');
const formatSeg = document.getElementById('formatSeg');
const qualHint = document.getElementById('qualHint');

let format = 'auto';
let quality = 80;
let items = []; // {file, url, resultBlob, resultSize, outName, sourceZip}

qualSlider.addEventListener('input', () => {
  quality = parseInt(qualSlider.value, 10);
  qualVal.textContent = quality;
});

function updateQualityUI() {
  const hasPng = items.some(it => it.file.type === 'image/png');
  const hasJpeg = items.some(it => /^image\/jpe?g$/i.test(it.file.type));
  const pngOnlyAuto = format === 'auto' && hasPng && !hasJpeg;

  qualSlider.disabled = pngOnlyAuto;
  qualHint.textContent = pngOnlyAuto
    ? 'PNG 원본유지에서는 품질 설정이 적용되지 않습니다'
    : '10 단위 조절 · 낮을수록 용량↓ 화질↓';
}

formatSeg.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    formatSeg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    format = btn.dataset.v;
    updateQualityUI();
  });
});

drop.addEventListener('click', () => { if (!fileInput.disabled) fileInput.click(); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

function uniqueZipName(name, used) {
  if (!used.has(name)) {
    used.add(name);
    return name;
  }

  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';

  let n = 1;
  let candidate;
  do {
    candidate = `${base} (${n})${ext}`;
    n++;
  } while (used.has(candidate));

  used.add(candidate);
  return candidate;
}

const zipStatus = document.getElementById('zipStatus');
const IMAGE_EXT = /\.(jpe?g|png)$/i;
const MAX_FILES = 500;
const MAX_TOTAL_INPUT = 1024 * 1024 * 1024;
const MAX_SINGLE_INPUT = 200 * 1024 * 1024;

async function extractZip(file) {
  const zip = await JSZip.loadAsync(file);
  const out = [];
  let total = 0;

  const entries = Object.values(zip.files).filter(
    f => !f.dir && IMAGE_EXT.test(f.name) && !f.name.startsWith('__MACOSX')
  );

  if (entries.length === 0) {
    throw new Error('ZIP 안에 JPG/PNG 이미지가 없습니다.');
  }

  if (entries.length > MAX_FILES) {
    throw new Error(`ZIP 안의 이미지가 너무 많습니다. 최대 ${MAX_FILES}개까지 지원합니다.`);
  }

  for (const entry of entries) {
    const blob = await entry.async('blob');

    if (blob.size > MAX_SINGLE_INPUT) {
      throw new Error(`개별 이미지가 너무 큽니다: ${entry.name}`);
    }

    total += blob.size;
    if (total > MAX_TOTAL_INPUT) {
      throw new Error('ZIP 안의 이미지 총 용량이 너무 큽니다. 최대 1 GiB까지 지원합니다.');
    }

    const type = /\.png$/i.test(entry.name) ? 'image/png' : 'image/jpeg';
    const typedBlob = blob.type ? blob : blob.slice(0, blob.size, type);
    const name = entry.name.split('/').pop();
    out.push(new File([typedBlob], name, { type }));
  }

  return { files: out, zipName: file.name };
}

async function handleFiles(fileArr) {
  items.forEach(it => {
    if (it.url) URL.revokeObjectURL(it.url);
  });

  const rawFiles = Array.from(fileArr);
  const zipFiles = rawFiles.filter(f => /\.zip$/i.test(f.name) || f.type === 'application/zip');
  const directImages = rawFiles.filter(f => IMAGE_EXT.test(f.name));
  const unsupported = rawFiles.filter(f => !IMAGE_EXT.test(f.name) && !/\.zip$/i.test(f.name) && f.type !== 'application/zip');

  // {file, sourceZip: null | zipFileName}
  let extracted = []; // [{file, sourceZip}]
  const zipErrors = [];
  if (zipFiles.length) {
    zipStatus.style.display = 'block';
    zipStatus.textContent = 'ZIP 압축 해제 중...';
    for (const zf of zipFiles) {
      try {
        const { files, zipName } = await extractZip(zf);
        files.forEach(f => extracted.push({ file: f, sourceZip: zipName }));
      } catch (e) {
        zipErrors.push(`${zf.name}: ${e.message || '압축 해제 실패'}`);
      }
    }
  }

  const directEntries = directImages.map(f => ({ file: f, sourceZip: null }));
  const allEntries = directEntries.concat(extracted);
  const allFiles = allEntries.map(e => e.file);
  const zipErrorMessage = zipErrors.length
    ? 'ZIP 처리 중 오류 — ' + zipErrors.join(' / ')
    : '';
  const unsupportedMessage = unsupported.length
    ? `${unsupported.length}개 파일은 지원하지 않는 형식이라 제외되었습니다 (JPG/PNG/ZIP만 지원)`
    : '';

  if (allFiles.length > MAX_FILES) {
    zipStatus.style.display = 'block';
    zipStatus.textContent = [
      zipErrorMessage,
      unsupportedMessage,
      `이미지는 최대 ${MAX_FILES}개까지 선택할 수 있습니다. (선택됨: ${allFiles.length}개)`
    ].filter(Boolean).join('\n');
    fileInput.value = '';
    items = [];
    renderList();
    actions.style.display = 'none';
    dlBtn.disabled = true;
    totalEl.style.display = 'none';
    return;
  }

  const totalInput = allFiles.reduce((sum, f) => sum + f.size, 0);
  if (totalInput > MAX_TOTAL_INPUT) {
    zipStatus.style.display = 'block';
    zipStatus.textContent = [
      zipErrorMessage,
      unsupportedMessage,
      '선택한 이미지의 총 용량이 너무 큽니다 (전체 최대 1 GiB).'
    ].filter(Boolean).join('\n');
    fileInput.value = '';
    items = [];
    renderList();
    actions.style.display = 'none';
    dlBtn.disabled = true;
    totalEl.style.display = 'none';
    return;
  }

  const oversized = allEntries.filter(e => e.file.size > MAX_SINGLE_INPUT);
  const withinLimit = allEntries.filter(e => e.file.size <= MAX_SINGLE_INPUT);
  if (oversized.length || zipErrorMessage || unsupportedMessage) {
    zipStatus.style.display = 'block';
    zipStatus.textContent = [
      zipErrorMessage,
      unsupportedMessage,
      oversized.length
        ? `${oversized.length}개 파일이 너무 커서 제외되었습니다 (최대 ${fmtSize(MAX_SINGLE_INPUT)})`
        : ''
    ].filter(Boolean).join('\n');
  } else {
    zipStatus.style.display = 'none';
  }

  fileInput.value = '';
  items = withinLimit.map(({ file, sourceZip }) => ({
    file,
    sourceZip,
    url: URL.createObjectURL(file),
    resultBlob: null,
    resultSize: null,
    outName: null
  }));
  renderList();
  updateQualityUI();
  actions.style.display = items.length ? 'flex' : 'none';
  dlBtn.disabled = true;
  totalEl.style.display = 'none';
}

function renderList() {
  filelist.innerHTML = '';

  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'file-item';

    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = it.url;
    thumb.alt = '';

    const finfo = document.createElement('div');
    finfo.className = 'finfo';

    const fname = document.createElement('div');
    fname.className = 'fname';
    fname.textContent = it.file.name;

    const fsize = document.createElement('div');
    fsize.className = 'fsize';
    fsize.id = `fsize-${i}`;
    fsize.textContent = fmtSize(it.file.size);

    const status = document.createElement('div');
    status.className = 'fstatus';
    status.id = `fstatus-${i}`;
    status.textContent = '대기';

    finfo.append(fname, fsize);
    row.append(thumb, finfo, status);
    filelist.appendChild(row);
  });
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('이미지를 불러올 수 없습니다.'));
    };

    img.src = url;
  });
}

async function compressOne(item) {
  const img = await loadImage(item.file);
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const isPng = item.file.type === 'image/png';
  let mime = item.file.type;
  let outName = item.file.name;

  if (isPng && format === 'jpeg') {
    // PNG -> JPEG: fill transparent with white first
    const flat = document.createElement('canvas');
    flat.width = canvas.width; flat.height = canvas.height;
    const fctx = flat.getContext('2d');
    fctx.fillStyle = '#ffffff';
    fctx.fillRect(0,0,flat.width,flat.height);
    fctx.drawImage(canvas, 0, 0);
    mime = 'image/jpeg';
    outName = outName.replace(/\.png$/i, '.jpg');
    const blob = await new Promise((resolve, reject) => flat.toBlob(blob => blob ? resolve(blob) : reject(new Error('JPEG 변환 실패')), mime, quality/100));
    return { blob, outName };
  }

  if (isPng && format === 'auto') {
    // keep PNG lossless-ish: browser PNG encoding has no quality param,
    // so we still re-encode (strips metadata) — quality slider has limited effect on PNG.
    mime = 'image/png';
    const blob = await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 변환 실패')), mime));
    return { blob, outName };
  }

  // JPEG (or forced jpeg on jpeg)
  mime = 'image/jpeg';
  if (!/\.(jpg|jpeg)$/i.test(outName)) outName = outName.replace(/\.\w+$/, '') + '.jpg';
  const blob = await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('JPEG 변환 실패')), mime, quality/100));
  return { blob, outName };
}

runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  runBtn.textContent = '처리 중...';
  fileInput.disabled = true;
  dlBtn.disabled = true;
  drop.style.pointerEvents = 'none';
  drop.style.opacity = '0.5';
  let sumBefore = 0, sumAfter = 0;
  let failCount = 0;

  const snapshot = items;
  for (let i = 0; i < snapshot.length; i++) {
    snapshot[i].resultBlob = null;
    snapshot[i].resultSize = null;
    snapshot[i].outName = null;
    const statusEl = document.getElementById(`fstatus-${i}`);
    const sizeEl = document.getElementById(`fsize-${i}`);
    statusEl.classList.remove('done');
    statusEl.textContent = '처리중';
    try {
      const { blob, outName } = await compressOne(snapshot[i]);
      snapshot[i].resultBlob = blob;
      snapshot[i].resultSize = blob.size;
      snapshot[i].outName = outName;
      sumBefore += snapshot[i].file.size;
      sumAfter += blob.size;
      const pct = Math.round((1 - blob.size/snapshot[i].file.size) * 100);
      sizeEl.textContent = `${fmtSize(snapshot[i].file.size)} → ${fmtSize(blob.size)} (${pct >= 0 ? '-' : '+'}${Math.abs(pct)}%)`;
      statusEl.textContent = '완료';
      statusEl.classList.add('done');
    } catch (e) {
      failCount++;
      statusEl.textContent = '실패';
    }
  }

  const successCount = snapshot.filter(it => !!it.resultBlob).length;
  totalBefore.textContent = fmtSize(sumBefore);
  totalAfter.textContent = fmtSize(sumAfter);
  totalEl.style.display = 'flex';

  runBtn.disabled = false;
  runBtn.textContent = '다시 실행';
  fileInput.disabled = false;
  drop.style.pointerEvents = '';
  drop.style.opacity = '';
  const zipGroupCount = new Set(items.filter(it => it.sourceZip).map(it => it.sourceZip)).size;
  const totalZipCount = (items.some(it => it.sourceZip === null && it.resultBlob) ? 1 : 0) + zipGroupCount;
  dlBtn.disabled = successCount === 0;
  dlBtn.textContent = totalZipCount > 1
    ? `ZIP ${totalZipCount}개 저장`
    : failCount ? `ZIP 저장 (${successCount}개)` : 'ZIP 저장';
});

async function downloadZip(zipName, zipItems) {
  const zip = new JSZip();
  const usedNames = new Set();
  zipItems.forEach(it => {
    if (it.resultBlob) zip.file(uniqueZipName(it.outName, usedNames), it.resultBlob);
  });
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = zipName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

dlBtn.addEventListener('click', async () => {
  dlBtn.disabled = true;
  dlBtn.textContent = 'ZIP 생성 중...';

  try {
    const successItems = items.filter(it => it.resultBlob);

    // 직접 선택한 이미지(sourceZip이 null)는 하나로 묶어 내보냄
    const directItems = successItems.filter(it => it.sourceZip === null);

    // ZIP에서 온 이미지는 원본 ZIP 이름별로 그룹핑
    const zipGroups = new Map();
    successItems.filter(it => it.sourceZip !== null).forEach(it => {
      if (!zipGroups.has(it.sourceZip)) zipGroups.set(it.sourceZip, []);
      zipGroups.get(it.sourceZip).push(it);
    });

    // 직접 선택 이미지 다운로드
    if (directItems.length > 0) {
      await downloadZip('compressed_photos.zip', directItems);
    }

    // ZIP별로 각각 다운로드 (짧은 간격을 두어 브라우저가 각각 받도록)
    for (const [zipName, groupItems] of zipGroups) {
      await new Promise(r => setTimeout(r, 300));
      const outName = zipName.replace(/\.zip$/i, '') + '_compressed.zip';
      await downloadZip(outName, groupItems);
    }

    dlBtn.textContent = 'ZIP 저장';
  } catch (e) {
    dlBtn.textContent = 'ZIP 생성 실패';
  } finally {
    dlBtn.disabled = false;
  }
});
</script>
</body>
</html>
